<!DOCTYPE html>

<head>

<style>
  :root{--paper:#070C18;--ink:#F4F7FB;--muted:#A8B4C6;--accent:#5B8CFF;--rule:rgba(255,255,255,.12)}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;
    background:var(--paper);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:18px;line-height:1.55;
  }
  .wrap{padding:3rem 1.25rem;max-width:34rem;margin:0 auto}
  .cifra{font-size:5rem;font-weight:800;letter-spacing:-0.05em;line-height:.9;margin:0 0 1rem;font-variant-numeric:tabular-nums;color:var(--accent)}
  h1{font-size:1.65rem;font-weight:800;letter-spacing:-0.022em;line-height:1.1;margin:0 0 .75rem}
  p{margin:0 0 1rem}
  .muted{color:var(--muted)}
  hr{border:0;border-top:1px solid var(--rule);margin:2rem 0}
  .azioni{display:flex;flex-direction:column;gap:.7rem;max-width:26rem}
  @media (min-width:34rem){.azioni{flex-direction:row;flex-wrap:wrap}}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:1rem 1.4rem;font-weight:700;
       text-decoration:none;border-radius:999px;border:1.5px solid transparent;letter-spacing:-0.01em}
  .btn-wa{background:linear-gradient(135deg,#053BF6,#2BB3E8);color:#fff}
  .btn-tel{background:rgba(255,255,255,.04);color:var(--ink);border-color:var(--rule)}
  a{color:var(--accent);text-underline-offset:3px}
  :focus-visible{outline:3px solid #2BB3E8;outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
  <div class="wrap">
    <p class="cifra">404</p>
    <h1>Questa pagina non c'è.</h1>
    <p class="muted">Può darsi che l'indirizzo sia stato scritto male, o che la pagina non esista più. Se ti serve qualcosa, chiedimelo direttamente.</p>
    <div class="azioni">

      <a class="btn btn-tel" href="tel:+393522010159">Chiama 352 201 0159</a>

    <hr>
